map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    server_tokens off;

    proxy_connect_timeout 10s;
    proxy_send_timeout 3600s;
    proxy_read_timeout 3600s;

    location / {
        default_type text/plain;
        return 200 "NOSTRA Proxy Online";
    }

    location ^~ /vps2/vless-ws {
        proxy_pass http://161.97.127.65:10001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location ^~ /vps2/@labokingfreesurf-1 {
        proxy_pass http://161.97.127.65:10003;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location ^~ /vps2/@labokingfreesurf-2 {
        proxy_pass http://161.97.127.65:10004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_buffering off;
    }

    location ^~ /vps2/@labokingfreesurf {
        proxy_pass http://161.97.127.65:10002;
